<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理员登录</title>
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body>

  <header class="admin-header" style="padding-bottom:0.5rem;">
    <div style="display:flex;align-items:center;gap:1rem;justify-content:center;">
      <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;">
        <span style="color:#fff;font-size:2rem;font-weight:700;">A</span>
      </div>
      <h1 style="margin:0;font-size:1.7rem;font-weight:600;letter-spacing:1px;">后台管理系统</h1>
    </div>
  </header>

  <main class="page-main centered-narrow" style="min-height:70vh;display:flex;align-items:center;justify-content:center;">
    <section class="section-card" style="box-shadow:0 8px 32px rgba(102,126,234,0.10);border:1.5px solid transparent;background-clip:padding-box;border-image:linear-gradient(135deg,#667eea,#764ba2)1;">
      <h2 class="auth-title" style="text-align:center;font-size:1.4rem;">管理员登录</h2>
      <p class="auth-sub" style="text-align:center;">请输入账号和密码登录后台</p>
      <div id="msg" class="alert" role="alert" style="transition:all .3s;opacity:0;"></div>

      <form id="loginForm" method="post" action="/api/login" autocomplete="on">
        <div class="form-group" style="position:relative;">
          <label for="username">用户名</label>
          <span style="position:absolute;left:12px;top:38px;color:#bdbdbd;font-size:1.1rem;pointer-events:none;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 8-4 8-4s8 0 8 4"/></svg>
          </span>
          <input id="username" name="username" type="text" placeholder="admin" required style="padding-left:38px;" />
        </div>
        <div class="form-group" style="position:relative;">
          <label for="password">密码</label>
          <span style="position:absolute;left:12px;top:38px;color:#bdbdbd;font-size:1.1rem;pointer-events:none;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="8" rx="2"/><path d="M12 16v-3a2 2 0 1 1 4 0v3"/></svg>
          </span>
          <input id="password" name="password" type="password" placeholder="••••••" required style="padding-left:38px;" />
        </div>
        <div class="form-actions" style="align-items:center;">
          <button type="submit" class="btn-primary" style="background:linear-gradient(135deg,#667eea,#764ba2);min-width:100px;transition:box-shadow .2s;box-shadow:0 2px 8px rgba(102,126,234,0.10);">登录</button>
          <a class="btn-secondary" href="/">返回首页</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    // 显示URL参数中的错误提示
    const params = new URLSearchParams(location.search);
    const msgEl = document.getElementById('msg');
    if (params.get('error') === '1') {
      msgEl.className = 'alert error';
      msgEl.textContent = '用户名或密码错误';
      msgEl.style.opacity = 1;
    } else if (params.get('logout') === '1') {
      msgEl.className = 'alert info';
      msgEl.textContent = '已退出登录';
      msgEl.style.opacity = 1;
    }

    // 可选：拦截提交，使用fetch提交JSON
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const body = { username: formData.get('username'), password: formData.get('password') };
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          const redirect = (data && data.redirect) || '/admin';
          location.href = redirect;
        } else {
          msgEl.className = 'alert error';
          msgEl.textContent = '用户名或密码错误';
          msgEl.style.opacity = 1;
        }
      } catch (err) {
        msgEl.className = 'alert error';
        msgEl.textContent = '网络错误，请稍后重试';
        msgEl.style.opacity = 1;
      }
    });
  </script>
</body>
</html>
